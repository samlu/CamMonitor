<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121212">
  <title>CamMonitor Web Viewer</title>
  <style>
    html, body {
      margin: 0;
      padding: 24px;
      background: #121212;
      color: #f0f4f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }
    a { color: #00E5FF; }
  </style>
</head>
<body>
  <p>Redirecting to <a id="fallback" href="./viewer/">CamMonitor Web Viewer</a>…</p>
  <script>
    (function () {
      var target = "./viewer/" + window.location.search + window.location.hash;
      var link = document.getElementById("fallback");
      if (link) link.setAttribute("href", target);
      window.location.replace(target);
    })();
  </script>
</body>
</html>
